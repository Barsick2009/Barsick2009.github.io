<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кабинет — Фаворит</title>
<meta name="theme-color" content="#07080b">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<div id="demoBar" class="demo-bar hide">Демо-кабинет: изменения видны только в этом браузере</div>

<div id="login" class="login hide">
  <form class="card" id="loginForm">
    <div class="row"><div class="logo" id="lLogo"></div><div><b id="lName"></b><div class="small muted">Кабинет владельца</div></div></div>
    <input id="lEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input id="lPass" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <div class="err" id="lErr"></div>
    <button class="btn primary block">Войти</button>
    <a href="./" class="small muted center">← На страницу записи</a>
  </form>
</div>

<div id="app" class="hide">
  <div class="adm-top"><div class="wrap row"><div class="logo" id="aLogo" style="width:38px;height:38px;border-radius:12px;font-size:15px"></div><div class="grow"><h1 id="aName"></h1><div class="small muted" id="aSub">Кабинет владельца</div></div><a class="btn icon" href="./" target="_blank" title="Открыть приложение" style="height:40px;width:40px"><svg class="i" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg></a><button class="btn icon" id="logout" title="Выйти" style="height:40px;width:40px"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div></div>
  <main class="wrap adm-main">
    <section id="tab-book"></section>
    <section id="tab-svc" class="hide"></section>
    <section id="tab-set" class="hide"></section>
  </main>
  <nav class="tabs">
    <button data-t="book" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Записи</button>
    <button data-t="svc"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Услуги и цены</button>
    <button data-t="set"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Профиль</button>
  </nav>
</div>

<div class="sheet-bg" id="bg"></div>
<section class="sheet" id="addSheet"><div class="grab"></div><div class="hd"><h3>Новая запись</h3><button class="btn icon close" style="height:36px;width:36px;background:var(--card)"><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="bd" id="addBody"></div><div class="ft"><button class="btn primary block" id="addSave">Сохранить</button></div></section>
<div class="toast" id="toast"></div>
<script type="module" src="admin.js"></script>
</body>
</html>
